{% load i18n %}
<!-- ══════════ КАК МЫ НАЧИНАЕМ РАБОТУ (линия этапов) ══════════ -->
{% if process_steps %}
<section id="process" class="py-20 md:py-28 bg-fog border-y-[1.5px] border-ink">
    <div class="max-w-site mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6 mb-12 md:mb-16">
            <div>
                <span class="eyebrow mb-5" data-reveal>{% trans "Процесс" %}</span>
                <h2 class="h-section" data-reveal style="--d:80ms">{% trans "Как мы начинаем работу" %}</h2>
            </div>
            <a href="#contact" data-request-type="partnership" class="link-arrow self-start md:self-auto" data-reveal style="--d:160ms">
                {% trans "Начать с заявки" %} <i data-lucide="arrow-right"></i>
            </a>
        </div>

        <ol class="steps list-none p-0 m-0" style="--n:{{ process_steps|length }}">
            {% for step in process_steps %}
            <li class="step" data-reveal style="--d:{{ forloop.counter0 }}00ms">
                <span class="step-node tnum" aria-hidden="true">{{ forloop.counter|stringformat:"02d" }}</span>
                <h3 class="h-card text-lg mb-2">{{ step.title }}</h3>
                <p class="text-muted text-[.95rem] leading-relaxed">{{ step.description }}</p>
            </li>
            {% endfor %}
        </ol>
    </div>
</section>
{% endif %}
