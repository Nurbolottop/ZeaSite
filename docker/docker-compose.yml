version: '3.8'
name: zea-hub

services:

  # ─── PostgreSQL ───────────────────────────────────────────────────
  db_hub:
    image: postgres:14
    container_name: postgres_db_hub
    env_file:
      - ../.env
    ports:
      - "5434:5432"          # локальный доступ: localhost:5434
    volumes:
      - postgres_data_hub:/var/lib/postgresql/data
    networks:
      - hub_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Django (dev) ─────────────────────────────────────────────────
  web_hub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: django_web_hub
    entrypoint: /entrypoint.sh
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../app:/app
      - ../app/static:/app/static
      - ../app/media:/app/media
      - ../app/private_media:/app/private_media
    env_file:
      - ../.env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.dev
      # Перекрываем .env для связи внутри Docker-сети
      - POSTGRES_HOST=db_hub
      - POSTGRES_PORT=5432
    depends_on:
      db_hub:
        condition: service_healthy
    ports:
      - "8086:8000"          # http://localhost:8086
    networks:
      - hub_network

networks:
  hub_network:
    driver: bridge

volumes:
  postgres_data_hub:
