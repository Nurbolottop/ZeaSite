{% load static %}{# Собственные стили сайта: дизайн-система «обведённый объём». Tailwind — отдельно, см. tailwind.config.js #}
    <style>
        :root {
            --milk:#FAF8F4; --fog:#ECEEF1; --paper:#FFFFFF; --ink:#17181C; --muted:#5A5D66;
            --line:rgba(23,24,28,.12);
            --lime:#D4E89A; --lime-soft:#F1F4E6; --lime-deep:#A9BF5E;
            --coral:#EFA28E; --coral-soft:#F8E7E1; --coral-deep:#CF8A76;
            --sky:#C3D5EE; --sky-soft:#E3ECF8; --sky-deep:#9DB4D6;
            --butter:#E9D48E;
            --f-display:'Unbounded','Manrope',system-ui,sans-serif;
            --f-body:'Manrope',system-ui,-apple-system,sans-serif;
            --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
            --ease:cubic-bezier(.2,.7,.2,1);
            --grain:url("{% static 'img/grain.png' %}");
        }
        * { box-sizing:border-box; }
        html { scroll-padding-top:96px; -webkit-text-size-adjust:100%; }
        body { margin:0; background:var(--milk); color:var(--ink); font-family:var(--f-body); overflow-x:hidden;
               -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
        ::selection { background:var(--lime); color:var(--ink); }
        :focus-visible { outline:2px solid var(--ink); outline-offset:3px; border-radius:6px; }
        img { max-width:100%; }
        h1,h2,h3 { text-wrap:balance; }

        /* ── Типографика ───────────────────────────── */
        .h-display { font-family:var(--f-display); font-weight:600; letter-spacing:-.035em; line-height:1.04; }
        .h-section { font-family:var(--f-display); font-weight:600; letter-spacing:-.03em; line-height:1.08;
                     font-size:clamp(1.9rem,1.2rem + 2.6vw,3.4rem); }
        .h-card { font-family:var(--f-display); font-weight:600; letter-spacing:-.02em; line-height:1.15; }
        .eyebrow { display:inline-flex; align-items:center; gap:.6rem; font:500 .72rem/1 var(--f-mono);
                   letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
        .eyebrow::before { content:''; width:.5rem; height:.5rem; border-radius:50%; background:var(--coral-deep); }
        .mono { font-family:var(--f-mono); }
        .mark { background:linear-gradient(transparent 58%, var(--lime) 58%, var(--lime) 92%, transparent 92%);
                padding:0 .08em; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
        .lead { color:var(--muted); font-size:clamp(1rem,.95rem + .3vw,1.15rem); line-height:1.65; }
        .tnum { font-variant-numeric:tabular-nums; }

        /* ── Кнопки ────────────────────────────────── */
        /* :not(.hidden) — чтобы утилиты hidden / md:inline-flex из Tailwind не перебивались */
        .btn:not(.hidden) { display:inline-flex; }
        .btn { align-items:center; justify-content:center; gap:.55rem; border-radius:999px;
               font-weight:700; font-size:.95rem; line-height:1; padding:1rem 1.5rem; cursor:pointer;
               transition:transform .25s var(--ease), background-color .25s, box-shadow .25s, color .25s;
               text-decoration:none; border:1.5px solid var(--ink); }
        .btn svg { width:1.05rem; height:1.05rem; transition:transform .25s var(--ease); }
        .btn:hover svg.i-arrow { transform:translateX(3px); }
        .btn-ink { background:var(--ink); color:#fff; }
        .btn-ink:hover { background:#000; transform:translateY(-2px); box-shadow:0 10px 24px -10px rgba(23,24,28,.55); }
        .btn-ghost { background:transparent; color:var(--ink); }
        .btn-ghost:hover { background:var(--paper); transform:translateY(-2px); }
        .btn-lime { background:var(--lime); color:var(--ink); }
        .btn-lime:hover { background:#C9E087; transform:translateY(-2px); box-shadow:0 10px 24px -12px rgba(23,24,28,.4); }
        .btn-sm { padding:.7rem 1.1rem; font-size:.875rem; }
        .link-arrow { display:inline-flex; align-items:center; gap:.4rem; font-weight:700; color:var(--ink);
                      text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:4px; }
        .link-arrow svg { width:1rem; height:1rem; transition:transform .25s var(--ease); }
        .link-arrow:hover svg { transform:translateX(3px); }

        /* ── Поверхности ───────────────────────────── */
        .panel { background:var(--paper); border:1.5px solid var(--ink); border-radius:1.75rem; position:relative; }
        .grain { position:relative; isolation:isolate; }
        .grain::after { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
                        background-image:var(--grain); background-size:128px; opacity:.55; z-index:3; }
        .sticker { display:inline-flex; align-items:center; gap:.4rem; font:500 .72rem/1 var(--f-mono);
                   border:1.3px solid var(--ink); border-radius:999px; padding:.42rem .7rem; background:var(--paper);
                   white-space:nowrap; }
        .sticker-lime { background:var(--lime); }
        .sticker-coral { background:var(--coral); }
        .sticker-sky { background:var(--sky); }
        .chip { display:inline-flex; align-items:center; font:500 .72rem/1 var(--f-mono); color:var(--ink);
                border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:.4rem .65rem; }
        .dot-grid { background-image:radial-gradient(rgba(23,24,28,.14) 1px, transparent 1.3px); background-size:22px 22px; }

        /* Тона карточек по полю «Цвет» из CMS */
        .tone { background:var(--tone-bg,var(--paper)); --tone-bg:var(--paper); --tone:var(--sky); }
        [data-color="green"],[data-color="yellow"] { --tone-bg:var(--lime-soft); --tone:var(--lime); }
        [data-color="orange"],[data-color="red"],[data-color="pink"] { --tone-bg:var(--coral-soft); --tone:var(--coral); }
        [data-color="blue"],[data-color="cyan"],[data-color="indigo"],[data-color="purple"] { --tone-bg:var(--sky-soft); --tone:var(--sky); }

        /* ── Появление секций (только при JS и без reduced-motion) ── */
        .js [data-reveal] { opacity:0; transform:translateY(22px);
                            transition:opacity .8s var(--ease), transform .8s var(--ease);
                            transition-delay:var(--d,0ms); }
        .js [data-reveal].is-in { opacity:1; transform:none; }

        /* ── Шапка ─────────────────────────────────── */
        .site-header { position:fixed; inset:0 0 auto 0; z-index:50; transition:background-color .3s, box-shadow .3s, border-color .3s;
                       border-bottom:1px solid transparent; }
        .site-header.is-scrolled { background:rgba(250,248,244,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
                                   border-bottom-color:var(--line); }
        .nav-pill { background:var(--paper); border:1.5px solid var(--ink); border-radius:999px; padding:.35rem; }
        .nav-link { display:block; padding:.6rem 1rem; border-radius:999px; font-weight:600; font-size:.9rem; color:var(--ink);
                    text-decoration:none; transition:background-color .2s; }
        .nav-link:hover { background:var(--fog); }
        .nav-link.active { background:var(--lime); }
        .lang-link { font:500 .72rem/1 var(--f-mono); text-transform:uppercase; padding:.5rem .55rem; border-radius:8px;
                     color:var(--muted); text-decoration:none; }
        .lang-link:hover { color:var(--ink); background:var(--fog); }
        .lang-link.is-current { color:var(--ink); background:var(--paper); box-shadow:inset 0 0 0 1.3px var(--ink); }
        .brand-mark { width:2.3rem; height:2.3rem; border-radius:.8rem; background:var(--lime); border:1.5px solid var(--ink);
                      display:grid; place-items:center; font:700 1rem/1 var(--f-display); box-shadow:0 3px 0 var(--ink); }
        .brand-name { font:700 1.25rem/1 var(--f-display); letter-spacing:-.04em; }

        /* ── Мобильное меню ────────────────────────── */
        .mobile-menu { transform:translateX(100%); transition:transform .4s var(--ease); background:var(--milk);
                       border-left:1.5px solid var(--ink); }
        .mobile-menu.open { transform:translateX(0); }
        .burger span { display:block; height:2px; background:var(--ink); border-radius:2px; }

        /* ── Hero ──────────────────────────────────── */
        .hero-scene { position:relative; }
        .hero-scene svg { width:100%; height:auto; display:block; overflow:visible; }
        .hero-layer { transition:transform .5s var(--ease); }
        .case-chip { display:inline-flex; align-items:center; gap:.6rem; background:var(--paper); border:1.5px solid var(--ink);
                     border-radius:999px; padding:.45rem .9rem .45rem .45rem; font-weight:700; font-size:.85rem; cursor:pointer;
                     transition:transform .25s var(--ease), box-shadow .25s; text-align:left; }
        .case-chip:hover { transform:translateY(-2px); box-shadow:0 3px 0 var(--ink); }
        .case-chip i { width:1.7rem; height:1.7rem; border-radius:50%; border:1.3px solid var(--ink); background:var(--tone); flex:none; }
        .case-chip small { display:block; font:500 .68rem/1.2 var(--f-mono); color:var(--muted); }

        /* ── Бенто «Направления» ───────────────────── */
        .bento { display:grid; gap:1rem; grid-template-columns:minmax(0,1fr); }
        .b-card { border:1.5px solid var(--ink); border-radius:1.75rem; overflow:hidden; display:flex; flex-direction:column;
                  min-width:0; background:var(--paper); transition:transform .4s var(--ease), box-shadow .4s; }
        .b-card:hover { transform:translateY(-4px); box-shadow:0 22px 44px -22px rgba(23,24,28,.28); }
        .b-card .b-txt { padding:1.6rem 1.6rem 0; display:grid; gap:.6rem; align-content:start; position:relative; z-index:1; }
        .b-card .b-art { margin-top:auto; padding:1rem .5rem 0; }
        .b-card .b-art svg { display:block; width:100%; height:auto; }
        .b-card .b-photo { margin:1.2rem; margin-top:auto; border-radius:1.1rem; overflow:hidden; border:1.5px solid var(--ink); aspect-ratio:4/3; }
        .b-card .b-photo img { width:100%; height:100%; object-fit:cover; display:block; }
        .b-tall { background:var(--tone-bg,var(--sky-soft)); }
        .b-cta { background:var(--ink); color:#fff; padding:1.8rem; display:flex; flex-direction:column; justify-content:space-between; gap:1.4rem; }
        .b-cta .lead { color:rgba(255,255,255,.72); }
        @media (min-width:768px) {
            .bento { grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-flow:dense; }
            .b-wide, .b-full, .b-cta { grid-column:span 2; }
        }
        @media (min-width:1100px) {
            .bento { grid-template-columns:repeat(6,minmax(0,1fr)); }
            .b-wide, .b-full { grid-column:span 4; display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr); align-items:end; }
            .b-full { grid-column:1 / -1; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); }
            :is(.b-wide,.b-full) .b-txt { padding-bottom:1.6rem; align-self:start; }
            :is(.b-wide,.b-full) .b-art { padding:1.2rem 1rem .4rem 0; }
            :is(.b-wide,.b-full) .b-photo { margin:1.2rem 1.2rem 1.2rem 0; }
            .b-full .b-art svg { max-height:340px; }
            .b-tall .b-art { margin-block:auto; padding:1.5rem 1rem; }
            .b-tall { grid-column:span 2; grid-row:span 2; }
            .b-tall.side-right { grid-column:5 / span 2; }
            .b-tall.side-left { grid-column:1 / span 2; }
            .b-cta.b-wide { grid-column:span 4; display:flex; align-items:flex-start; }
            .b-cta.b-full { grid-column:1 / -1; display:flex; flex-direction:row; align-items:center; justify-content:space-between; }
        }

        /* Бегущая строка стека */
        .marquee { overflow:hidden; mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
                   -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent); }
        .marquee-track { display:flex; gap:.6rem; width:max-content; animation:marquee 38s linear infinite; }
        .marquee:hover .marquee-track { animation-play-state:paused; }
        @keyframes marquee { to { transform:translateX(-50%); } }
        .tech { display:inline-flex; align-items:center; gap:.55rem; background:var(--paper); border:1.3px solid var(--ink);
                border-radius:999px; padding:.4rem .9rem .4rem .4rem; font-weight:700; font-size:.88rem; white-space:nowrap; }
        .tech b { width:1.75rem; height:1.75rem; border-radius:50%; display:grid; place-items:center; background:var(--tone);
                  border:1.2px solid var(--ink); font:500 .6rem/1 var(--f-mono); overflow:hidden; }
        .tech b img { width:1.1rem; height:1.1rem; object-fit:contain; }

        /* ── Проекты ───────────────────────────────── */
        .browser { border:1.5px solid var(--ink); border-radius:1.1rem; overflow:hidden; background:var(--paper); }
        .browser-bar { display:flex; align-items:center; gap:.35rem; padding:.6rem .8rem; border-bottom:1.5px solid var(--ink); }
        .browser-bar i { width:.6rem; height:.6rem; border-radius:50%; border:1px solid var(--ink); }
        .browser-bar i:nth-child(1) { background:var(--coral); } .browser-bar i:nth-child(2) { background:var(--lime); } .browser-bar i:nth-child(3) { background:var(--sky); }
        .browser-bar span { margin-left:.5rem; font:500 .68rem/1 var(--f-mono); color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .browser img { display:block; width:100%; aspect-ratio:3/2; object-fit:cover; object-position:top; }
        .cover { position:relative; aspect-ratio:3/2; border:1.5px solid var(--ink); border-radius:1.1rem; overflow:hidden;
                 background:var(--tone-bg); display:flex; flex-direction:column; justify-content:space-between; padding:1.2rem; }
        .cover-name { font:600 clamp(1.4rem,1rem + 1.6vw,2.4rem)/1.05 var(--f-display); letter-spacing:-.035em; position:relative; z-index:1; overflow-wrap:anywhere; }
        .cover-mono { font-size:clamp(4.5rem,3rem + 6vw,9rem); line-height:.85; letter-spacing:-.06em; }
        .cover-ball { position:absolute; right:-8%; bottom:-18%; width:56%; aspect-ratio:1; border-radius:50%; border:1.5px solid var(--ink);
                      background:radial-gradient(circle at 34% 30%, #fff 0%, var(--tone) 46%, var(--tone-deep,var(--sky-deep)) 100%); }
        [data-color="green"] .cover-ball,[data-color="yellow"] .cover-ball { --tone-deep:var(--lime-deep); }
        [data-color="orange"] .cover-ball,[data-color="red"] .cover-ball,[data-color="pink"] .cover-ball { --tone-deep:var(--coral-deep); }
        .cover-stack { display:flex; flex-wrap:wrap; gap:.35rem; position:relative; z-index:1; max-width:70%; }
        .p-card { display:flex; flex-direction:column; gap:1rem; min-width:0; }
        .p-card .p-media { transition:transform .45s var(--ease); }
        .p-card:hover .p-media { transform:translateY(-4px) rotate(-.4deg); }
        .p-feature { display:grid; gap:2rem; align-items:center; }
        @media (min-width:1024px) { .p-feature { grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:3.5rem; } }
        .p-more[hidden] { display:none !important; }

        /* ── Процесс ───────────────────────────────── */
        .steps { position:relative; display:grid; gap:1.4rem; }
        .steps::before { content:''; position:absolute; left:1.05rem; top:.6rem; bottom:.6rem; width:0; border-left:1.5px dashed var(--ink); opacity:.5; }
        .step { position:relative; padding-left:3.2rem; }
        .step-node { position:absolute; left:0; top:0; width:2.1rem; height:2.1rem; border-radius:50%; border:1.5px solid var(--ink);
                     background:var(--paper); display:grid; place-items:center; font:500 .7rem/1 var(--f-mono); }
        .step:first-child .step-node { background:var(--lime); }
        .step:last-child .step-node { background:var(--coral); }
        @media (min-width:1024px) {
            .steps { grid-template-columns:repeat(var(--n,6),minmax(0,1fr)); gap:1.2rem; padding-top:.2rem; }
            .steps::before { left:1rem; right:1rem; top:1.05rem; bottom:auto; height:0; width:auto; border-left:0; border-top:1.5px dashed var(--ink); }
            .step { padding-left:0; padding-top:3.4rem; }
            .step-node { left:0; }
        }

        /* ── О нас ─────────────────────────────────── */
        .photo-frame { border:1.5px solid var(--ink); border-radius:1.75rem; overflow:hidden; position:relative; aspect-ratio:4/3; background:var(--fog); }
        .photo-frame img { width:100%; height:100%; object-fit:cover; display:block; }
        .photo-caption { position:absolute; left:1rem; bottom:1rem; transform:rotate(-2deg); max-width:calc(100% - 2rem); white-space:normal; line-height:1.3; }
        .spec-row { display:grid; grid-template-columns:auto minmax(0,1fr); gap:.4rem 1rem; padding:1.15rem 0; border-top:1.5px solid var(--ink); }
        .spec-row:last-child { border-bottom:1.5px solid var(--ink); }
        .spec-ico { width:2.4rem; height:2.4rem; border-radius:.8rem; border:1.4px solid var(--ink); background:var(--tone); display:grid; place-items:center; grid-row:span 2; }
        .spec-ico svg { width:1.15rem; height:1.15rem; }
        .why-card { border:1.5px solid var(--ink); border-radius:1.4rem; padding:1.4rem; background:var(--paper); display:grid; gap:.55rem; align-content:start;
                    transition:transform .35s var(--ease), background-color .35s; }
        .why-card:hover { transform:translateY(-3px); background:var(--tone-bg); }
        .why-ico { width:2.6rem; height:2.6rem; border-radius:50%; border:1.4px solid var(--ink); display:grid; place-items:center;
                   background:radial-gradient(circle at 34% 30%, #fff 0%, var(--tone) 60%); }
        .why-ico svg { width:1.1rem; height:1.1rem; }
        .team-card figure { margin:0; }
        .team-photo { aspect-ratio:4/5; border:1.5px solid var(--ink); border-radius:1.3rem; overflow:hidden; background:var(--tone-bg); display:grid; place-items:center; }
        .team-photo img { width:100%; height:100%; object-fit:cover; display:block; }
        .team-photo span { font:600 2rem/1 var(--f-display); letter-spacing:-.04em; }
        .stat { border-top:1.5px solid var(--ink); padding-top:1rem; display:grid; gap:.35rem; }
        .stat-num { font:600 clamp(2.4rem,1.6rem + 2.6vw,3.8rem)/1 var(--f-display); letter-spacing:-.05em; }
        .partner { display:flex; align-items:center; gap:.8rem; border:1.3px solid var(--ink); border-radius:999px; background:var(--paper); padding:.45rem 1.1rem .45rem .45rem; }
        .partner-logo { width:2.4rem; height:2.4rem; border-radius:50%; border:1.2px solid var(--ink); overflow:hidden; display:grid; place-items:center; background:var(--tone); flex:none; }
        .partner-logo img { width:100%; height:100%; object-fit:contain; background:#fff; }
        .partner-logo svg { width:1.1rem; height:1.1rem; }

        /* ── Сотрудничество ────────────────────────── */
        .coop { border:1.5px solid var(--ink); border-radius:2rem; overflow:hidden; display:flex; flex-direction:column; min-width:0; }
        .coop-primary { background:var(--lime-soft); }
        .coop-secondary { background:var(--paper); }
        .coop .terms { display:flex; gap:.7rem; align-items:flex-start; border:1.3px dashed var(--ink); border-radius:1rem; padding:.85rem 1rem; font-size:.9rem; }
        .coop .terms svg { width:1rem; height:1rem; flex:none; margin-top:.15rem; }

        /* ── Контакты ──────────────────────────────── */
        .channel { display:flex; align-items:center; gap:.9rem; background:var(--paper); border:1.5px solid var(--ink); border-radius:1.3rem 1.3rem 1.3rem .35rem;
                   padding:.8rem 1.1rem .8rem .8rem; font-weight:700; text-decoration:none; color:var(--ink);
                   transition:transform .25s var(--ease), box-shadow .25s; max-width:100%; }
        .channel:hover { transform:translateY(-2px); box-shadow:0 3px 0 var(--ink); }
        .channel i { width:2.4rem; height:2.4rem; border-radius:50%; border:1.3px solid var(--ink); display:grid; place-items:center; flex:none; }
        .channel i svg { width:1.05rem; height:1.05rem; }
        .channel small { display:block; font:500 .7rem/1.2 var(--f-mono); color:var(--muted); }
        .channel .ch-text { min-width:0; overflow-wrap:anywhere; }
        .cf-label { display:block; font-size:.85rem; font-weight:700; margin-bottom:.45rem; }
        .cf-input { width:100%; background:var(--milk); border:1.5px solid rgba(23,24,28,.22); border-radius:.9rem; padding:.85rem 1rem;
                    font:500 .95rem/1.4 var(--f-body); color:var(--ink); transition:border-color .2s, background-color .2s, box-shadow .2s; }
        .cf-input::placeholder { color:#8D9099; }
        .cf-input:hover { border-color:rgba(23,24,28,.45); }
        .cf-input:focus { outline:none; border-color:var(--ink); background:var(--paper); box-shadow:0 0 0 4px rgba(212,232,154,.7); }
        .cf-input.cf-error { border-color:#C2412D; background:#FFF6F3; }
        select.cf-input { appearance:none; -webkit-appearance:none; cursor:pointer; padding-right:2.6rem; }
        select.cf-input.is-empty { color:#8D9099; }
        .rt-option input { position:absolute; opacity:0; pointer-events:none; }
        .rt-option span { display:flex; align-items:center; justify-content:center; text-align:center; height:100%; min-height:3.1rem; padding:.6rem .8rem;
                          border:1.5px solid rgba(23,24,28,.22); border-radius:.9rem; background:var(--milk); font-weight:700; font-size:.88rem; line-height:1.25;
                          transition:background-color .2s, border-color .2s; cursor:pointer; }
        .rt-option span:hover { border-color:var(--ink); }
        .rt-option input:checked + span { background:var(--lime); border-color:var(--ink); }
        .rt-option input:focus-visible + span { outline:2px solid var(--ink); outline-offset:2px; }
        .cf-error-text { color:#B03A27; }

        /* ── Подвал ────────────────────────────────── */
        .site-footer { background:var(--fog); border-top:1.5px solid var(--ink); overflow:hidden; }
        .footer-word { font:700 clamp(5rem,22vw,19rem)/.8 var(--f-display); letter-spacing:-.045em; color:#DCDFE5;
                       user-select:none; white-space:nowrap; }

        /* ── Окно проекта ──────────────────────────── */
        .modal { opacity:0; transition:opacity .25s; }
