{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'ru' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>404 — {% trans "Страница не найдена" %}</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { min-height:100vh; display:grid; place-items:center; padding:24px; background:#FAF8F4; color:#17181C;
               font-family:'Manrope',system-ui,sans-serif;
               background-image:radial-gradient(rgba(23,24,28,.13) 1px, transparent 1.3px); background-size:22px 22px; }
        .card { position:relative; max-width:560px; width:100%; background:#fff; border:1.5px solid #17181C; border-radius:28px;
                padding:40px 32px 36px; box-shadow:0 6px 0 #17181C; text-align:left; }
        .tag { display:inline-flex; align-items:center; gap:8px; font:500 12px/1 'JetBrains Mono',monospace; letter-spacing:.12em;
               text-transform:uppercase; border:1.3px solid #17181C; border-radius:999px; padding:7px 12px; background:#C3D5EE; }
        .code { font:700 clamp(84px,20vw,148px)/.9 'Unbounded',sans-serif; letter-spacing:-.06em; margin:26px 0 18px; }
        .ball { position:absolute; right:-26px; top:-26px; width:84px; height:84px; border-radius:50%; border:1.5px solid #17181C;
                background:radial-gradient(circle at 34% 30%, #fff 0%, #C3D5EE 46%, #8FA9CF 100%); }
        h1 { font:600 clamp(22px,4.5vw,28px)/1.2 'Unbounded',sans-serif; letter-spacing:-.02em; margin-bottom:12px; }
        p { color:#5A5D66; font-size:16px; line-height:1.6; margin-bottom:28px; }
        .btn { display:inline-flex; align-items:center; gap:8px; background:#17181C; color:#fff; text-decoration:none;
               font-weight:700; font-size:15px; padding:15px 24px; border-radius:999px; transition:transform .2s; }
        .btn:hover { transform:translateY(-2px); }
        .btn:focus-visible { outline:2px solid #17181C; outline-offset:3px; }
        @media (prefers-reduced-motion:reduce) { .btn { transition:none; } .btn:hover { transform:none; } }
    </style>
</head>
<body>
    <main class="card">
        <span class="ball" aria-hidden="true"></span>
        <img src="{% static 'img/zea-logo.svg' %}" alt="ZEA Hub" style="height:44px;width:auto;display:block;margin-bottom:22px">
        <span class="tag">Error 404</span>
        <div class="code">404</div>
        <h1>{% trans "Страница не найдена" %}</h1>
        <p>{% trans "Возможно, ссылка устарела или страница была перемещена. Вернитесь на главную — там всё на месте." %}</p>
        <a href="/" class="btn">{% trans "На главную" %} <span class="arrow">→</span></a>
    </main>
</body>
</html>
