{# Логотип из настроек (для светлого фона) или текстовый знак. size: lg (шапка) / sm (меню, подвал) #}
{% if settings.logo %}
<img src="{{ settings.logo.url }}" alt="{{ settings.site_name }}"
     class="{% if size == 'lg' %}h-10 md:h-12{% else %}h-8{% endif %} w-auto object-contain">
{% else %}
<span class="brand-mark" aria-hidden="true">{{ settings.site_name|first }}</span>
<span class="brand-name">{{ settings.site_name }}</span>
{% endif %}
